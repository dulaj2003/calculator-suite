<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A fast, polished calculator for everyday arithmetic." />
    <title>Professional Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="calculator-wrap" aria-labelledby="calculator-title">

        <div class="calculator-card">
          <div class="display-panel" aria-live="polite" aria-atomic="true">
            <p class="expression" id="expression">Ready</p>
            <output class="display" id="display">0</output>
          </div>

          <div class="keypad" aria-label="Calculator keypad">
            <button class="key key--utility" data-action="clear">AC</button>
            <button class="key key--utility" data-action="sign" aria-label="Toggle positive or negative">+/−</button>
            <button class="key key--utility" data-action="percent">%</button>
            <button class="key key--operator" data-operator="/" aria-label="Divide">÷</button>

            <button class="key" data-number="7">7</button>
            <button class="key" data-number="8">8</button>
            <button class="key" data-number="9">9</button>
            <button class="key key--operator" data-operator="*" aria-label="Multiply">×</button>

            <button class="key" data-number="4">4</button>
            <button class="key" data-number="5">5</button>
            <button class="key" data-number="6">6</button>
            <button class="key key--operator" data-operator="-" aria-label="Subtract">−</button>

            <button class="key" data-number="1">1</button>
            <button class="key" data-number="2">2</button>
            <button class="key" data-number="3">3</button>
            <button class="key key--operator" data-operator="+" aria-label="Add">+</button>

            <button class="key" data-action="backspace" aria-label="Delete last digit">⌫</button>
            <button class="key" data-number="0">0</button>
            <button class="key" data-action="decimal" aria-label="Decimal point">.</button>
            <button class="key key--equals" data-action="equals" aria-label="Calculate result">=</button>
          </div>
        </div>

        <footer class="hint-row">
          <span>Keyboard supported</span>
          <span><kbd>Esc</kbd> clear</span>
          <span><kbd>Enter</kbd> calculate</span>
        </footer>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
